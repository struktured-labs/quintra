name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Mute the new-run foyer vignette and the power-on lore intro in PyBoy
  # contracts. test_stage_vignettes sets QUINTRA_KEEP_VIGNETTES=1 and
  # test_attract_mode sets QUINTRA_KEEP_INTRO=1.
  PYTHONPATH: scripts/quintra_sitecustomize

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        # These seven lints already fire on main. Allowing them keeps the
        # gate on new warnings without a formatting-only rewrite.
        run: >
          cargo clippy --workspace --locked --all-targets --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::needless_range_loop
          -A clippy::unnecessary_cast
          -A clippy::if_same_then_else
          -A clippy::manual_range_contains
          -A clippy::useless_format
          -A clippy::manual_div_ceil

      - name: Build
        run: cargo build --workspace --locked --all-targets

      - name: Test
        run: cargo test --workspace --locked --all-targets

      - name: Sun Lattice C/Rust generator parity
        run: |
          cargo build --release --locked -p quintra-procgen --bin sun-lattice-dump
          python3 scripts/test_sun_lattice_parity.py 3000

  web:
    name: Browser player gamepad mapping
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Gamepad input checks
        run: |
          node --check web/itch/player.js
          for f in desktop/main.js desktop/preload.js desktop/renderer/desktop.js desktop/scripts/stage.mjs desktop/test/selftest.mjs; do node --check "$f"; done
          node tools/test_itch_gamepad.mjs web/itch/player.js
          node tools/test_itch_gamepad_layouts.mjs web/itch/player.js
          node tools/test_itch_pad_calibration.mjs web/itch/player.js
          node tools/test_itch_telemetry.mjs web/itch/player.js

  rom:
    name: ROM build and cart smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-native

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            Makefile
            scripts/test_suspend.py

      - name: Link ROM
        id: link_rom
        run: |
          set -euo pipefail
          make gen
          make -j"$(nproc)" rom/working/quintra.gbc
          python3 scripts/check_cartridge.py rom/working/quintra.gbc
          sha256sum rom/working/quintra.gbc

      - name: PyBoy new game and Continue start, all heroes and boot paths (room, spawn, music, vignette champion)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_new_game_start.py

      - name: PyBoy new specialists (Wizrobe, Hand, Brute, Dart, Leybeam, Fuse Hurler)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: |
          for t in veil_magus hex_walker vault_hand bane_brute zag_dart leybeam fuse_hurler confusion_fx; do
            uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_$t.py
          done

      - name: PyBoy room performance (CGB double-speed)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_performance.py

      - name: Balance smoke (stage 3 Colossus win rate, status-death share; average tier)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: |
          set -euo pipefail
          luac -p scripts/quintra_human_model.lua scripts/quintra_balance_bot.lua
          python3 scripts/test_balance_harness.py
          export PYTHONPATH="$PWD/scripts/quintra_sitecustomize" QUINTRA_STATE_WAIVE_CHECKS=marked_gate
          mkdir -p tmp/balance-ci
          uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/make_stage_states.py \
            --rom rom/working/quintra.gbc --stage 3 --difficulty normal --out tmp/balance-ci/states \
            > tmp/balance-ci/states.log 2>&1 || { tail -20 tmp/balance-ci/states.log; exit 1; }
          uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/balance_arena.py \
            --rom rom/working/quintra.gbc --state-dir tmp/balance-ci/states --skills average \
            --stages 3 --kinds boss --seeds 3 --jobs "$(nproc)" --out tmp/balance-ci/arena.csv
          python3 scripts/balance_report.py tmp/balance-ci/arena.csv --out tmp/balance-ci/report \
            --trials 300 --check scripts/balance_thresholds.json
          cat tmp/balance-ci/report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Room status smoke (stage 3 rooms incl. Cinder, status-death lift; average tier)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/scripts/quintra_sitecustomize" QUINTRA_STATE_WAIVE_CHECKS=marked_gate
          R="uv run --quiet --with pyboy==2.7.0 --with pillow python scripts/balance_rooms.py"
          $R fixtures --stages 3 --difficulties normal --rooms 2 --extra "" --cinder 2 \
            --jobs "$(nproc)" --out tmp/balance-ci/rooms
          $R fight --fixtures tmp/balance-ci/rooms --stages 3 --skills average --seeds 3 \
            --jobs "$(nproc)" --out tmp/balance-ci/rooms-normal.csv
          python3 scripts/balance_rooms_report.py tmp/balance-ci/rooms-normal.csv \
            --out tmp/balance-ci/rooms-report --check scripts/balance_thresholds.json
          cat tmp/balance-ci/rooms-report/rooms-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: PyBoy suspend power-cycle
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_suspend.py

      - name: PyBoy title sprite leak
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_title_sprite_leak.py

      - name: PyBoy title cold OBJ palettes
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_title_cold_obj_palettes.py

      - name: PyBoy persistent eight-way aim
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_persistent_aim.py

      - name: PyBoy Mire Heart roots
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_mire_roots.py

      - name: PyBoy secret door seal
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_secret_door_seal.py

      - name: PyBoy heart HUD
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_heart_hud.py

      - name: PyBoy mid-room palette heal
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_palette_heal.py

      - name: PyBoy puzzle final note
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_puzzle_note.py

      - name: PyBoy puzzle contracts (rune plate art, colours, pressed state)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_puzzles.py
      - name: PyBoy Prism orb tiles (door carve and stale Law Lock cache)
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_prism_orb_tiles.py

      - name: PyBoy plate reachability (Aether row and rune-sequence, feet flood-fill)
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_plate_reachability.py

      - name: PyBoy post-boss Riftwild landing (all heroes, feet-clear spawn)
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_boss_exit_landing.py

      - name: PyBoy Cinder Rex pose
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_cinder_rex_pose.py

      - name: PyBoy bigger Cinder Rex and fire pools
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_cinder_big.py

      - name: PyBoy Cinder Rex late-fight armor feedback
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_cinder_absorb.py

      - name: PyBoy dialogue radius
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_dialogue_radius.py

      - name: PyBoy merchant counter reach
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_merchant_counter.py

      - name: PyBoy companion greeting
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_companion_greeting.py

      - name: PyBoy merchant stock
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_merchant_stock.py

      - name: PyBoy merchant Compass marks
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_merchant_map.py

      - name: PyBoy Wolfkin Will wave
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_wolfkin_will_wave.py

      - name: PyBoy Wolfkin Longblade (slash, stab, beam, formation shots)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_wolfkin_longsword.py

      - name: PyBoy per-hero identity ailment resists
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_class_status_resist.py

      - name: PyBoy Picsean Tide Vortex
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_picsean_tide_vortex.py

      - name: PyBoy max-Will v2 arts
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_will_max_v2.py

      - name: PyBoy crystal cluster
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_crystal_cluster.py

      - name: PyBoy Rift Wild label
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_riftwild_label.py

      - name: PyBoy Riftwild dens
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_riftwild_dens.py

      - name: PyBoy secret merchants (Veil vaults and Riftwild caves)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_secret_merchants.py

      - name: PyBoy suspend layout compatibility
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_sram_compat.py

      - name: PyBoy hero-select win crowns (per-hero counts, tiers, save compat)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_hero_win_crowns.py

      - name: PyBoy Riftwild set pieces and tile art
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_riftwild_setpiece.py

      - name: PyBoy Riftwild tiles (no orphan quarters, open calm fields)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_riftwild_tiles.py

      - name: Stage vignette data is current
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with numpy --with pillow python scripts/gen_vignettes.py --check

      - name: Stage vignette play, skip, once, CUTSCENES OFF (headless)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow --with numpy python scripts/test_stage_vignettes.py

      - name: Lore intro data is current
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with numpy --with pillow python scripts/gen_intro.py --check

      - name: Lore intro skip and attract mode (idle, exit, no SRAM writes, demo replay)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_attract_mode.py

      - name: WATCH INTRO on the records page (play, A/B/START skip, back to records)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_watch_intro.py

      - name: PyBoy Riftwild mission pull (Warden, then gate)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_riftwild_mission.py

      - name: PyBoy Riftwild field density
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_riftwild_density.py

      - name: PyBoy Riftwild guard field spawn (all heroes, both difficulties, seed sweep; #242/#245)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_riftwild_guard_spawn.py

      - name: PyBoy Crystal Colossus pose
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_crystal_pose.py

      - name: PyBoy Sun Golem pose
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_golem_pose.py

      - name: PyBoy Void Lord pose
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_void_pose.py

      - name: PyBoy Serpent jaw
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_serpent_jaw.py

      - name: PyBoy Serpent plated tail shield
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_serpent_tail_shield.py

      - name: PyBoy Reaper pose
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_reaper_pose.py

      - name: PyBoy Sun Lattice Hookshot and Morningstar
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_sun_lattice_tools.py

      - name: PyBoy Will-scaled Morningstar and Boomerang
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_will_b_weapons.py

      - name: Headless mGBA smoke
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: bash scripts/test_smoke.sh rom/working/quintra.gbc

      - name: Hexa Dragmar
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_hexa_dragmar.py

      - name: Hexa Dragmar body art
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_hexa_body_art_and_contrast.py

      - name: PyBoy B-item icon picker and equipped-B HUD
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_b_item_picker.py

      - name: PyBoy pickup notices (every pickup names its effect)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: |
          uv run --quiet --with "pyboy==2.7.0" python scripts/test_pickup_notices.py
          uv run --quiet --with "pyboy==2.7.0" python scripts/test_stat_max_pickup.py
          python3 scripts/test_stat_drop_curve.py
          uv run --quiet --with "pyboy==2.7.0" python scripts/test_pickup_feedback.py

      - name: PyBoy temporary power-ups
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_powerups.py

      - name: PyBoy boss drop persist
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_boss_drop_persist.py

      - name: PyBoy water ride (Tide Raft and Picsean swim)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_water_ride.py

      - name: PyBoy status effects (no DoT death, notices, Antidote cures)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: |
          mkdir -p tmp
          uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_status_floor.py
          uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_antidote.py
          uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_riftwild_trader_wares.py

      - name: PyBoy seeded-room fixtures (archetypes, spinners, Cinder Maw, Farfold Cache)
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        run: |
          mkdir -p tmp
          for t in stage_archetypes bramble_sprite sunwheel void_halo medium_cinder farfold_cache; do
            uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_$t.py
          done

      - name: Upload ROM
        if: (success() || failure()) && steps.link_rom.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quintra-gbc
          if-no-files-found: error
          path: |
            rom/working/quintra.gbc
            rom/working/quintra.map
            rom/working/quintra.noi

      - name: Cart smoke summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo '## Cart smoke'
            echo
            echo 'Every contract after Link ROM now runs even if an earlier'
            echo 'one failed, so a known red step cannot hide later regressions.'
            echo 'This job stays red if any of those steps failed.'
            echo
            echo "- Link ROM: ${{ steps.link_rom.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.link_rom.outcome }}" != "success" ]; then
            echo 'Link ROM did not succeed; later contracts were skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  desktop:
    name: Desktop wrapper (Electron, Windows + Linux)
    needs: rom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download ROM
        uses: actions/download-artifact@v4
        with:
          name: quintra-gbc
          path: rom/working

      - name: Install Xvfb and Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth zip \
            libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1

      - name: Build the web bundle
        run: tools/build_itch_web.sh

      - name: Install wrapper dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Package Windows and Linux builds
        run: bash desktop/scripts/package.sh

      - name: Headless self-test (Linux build)
        run: node desktop/test/selftest.mjs

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: quintra-desktop-linux-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            builds/desktop/quintra-desktop-*-linux-x64.tar.gz
            builds/desktop/SHA256SUMS

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: quintra-desktop-win-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            builds/desktop/quintra-desktop-*-win-x64.zip
            builds/desktop/SHA256SUMS

      - name: Upload self-test captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quintra-desktop-selftest
          if-no-files-found: warn
          path: builds/desktop/selftest/

  manual:
    name: Instruction manual
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Python libraries
        run: python3 -m pip install --user --break-system-packages pillow pypdf

      - name: Build the booklet and preview
        run: make manual

      - name: Upload manual
        uses: actions/upload-artifact@v4
        with:
          name: quintra-manual
          if-no-files-found: error
          path: |
            docs/manual/build/pdf/quintra-manual.pdf
            docs/manual/build/pdf/quintra-manual-booklet.pdf
            docs/manual/build/contact/spreads-contact.png
            docs/manual/build/site/
