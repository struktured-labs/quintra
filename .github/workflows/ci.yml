name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        # These seven lints already fire on main. Allowing them keeps the
        # gate on new warnings without a formatting-only rewrite.
        run: >
          cargo clippy --workspace --locked --all-targets --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::needless_range_loop
          -A clippy::unnecessary_cast
          -A clippy::if_same_then_else
          -A clippy::manual_range_contains
          -A clippy::useless_format
          -A clippy::manual_div_ceil

      - name: Build
        run: cargo build --workspace --locked --all-targets

      - name: Test
        run: cargo test --workspace --locked --all-targets

  rom:
    name: ROM build and cart smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/setup-native

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            Makefile
            scripts/test_suspend.py

      - name: Link ROM
        run: |
          set -euo pipefail
          make gen
          make -j"$(nproc)" rom/working/quintra.gbc
          python3 scripts/check_cartridge.py rom/working/quintra.gbc
          sha256sum rom/working/quintra.gbc

      - name: PyBoy suspend power-cycle
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_suspend.py

      - name: PyBoy title sprite leak
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_title_sprite_leak.py

      - name: PyBoy persistent eight-way aim
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_persistent_aim.py

      - name: PyBoy Mire Heart roots
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_mire_roots.py

      - name: PyBoy secret door seal
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_secret_door_seal.py

      - name: PyBoy heart HUD
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_heart_hud.py

      - name: PyBoy puzzle final note
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_puzzle_note.py

      - name: PyBoy Cinder Rex pose
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_cinder_rex_pose.py

      - name: PyBoy dialogue radius
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_dialogue_radius.py

      - name: PyBoy companion greeting
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_companion_greeting.py

      - name: PyBoy merchant stock
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_merchant_stock.py

      - name: PyBoy crystal cluster
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_crystal_cluster.py

      - name: PyBoy Rift Wild label
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_riftwild_label.py

      - name: PyBoy Crystal Colossus pose
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_crystal_pose.py

      - name: PyBoy Sun Golem pose
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_golem_pose.py

      - name: PyBoy Void Lord pose
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_void_pose.py

      - name: PyBoy Serpent jaw
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_serpent_jaw.py

      - name: PyBoy Reaper pose
        run: uv run --quiet --with "pyboy==2.7.0" --with pillow python scripts/test_reaper_pose.py

      - name: Headless mGBA smoke
        run: bash scripts/test_smoke.sh rom/working/quintra.gbc

      - name: Hexa Dragmar
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_hexa_dragmar.py

      - name: Hexa Dragmar body art
        run: uv run --quiet --with "pyboy==2.7.0" python scripts/test_hexa_body_art_and_contrast.py

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: quintra-gbc
          if-no-files-found: error
          path: |
            rom/working/quintra.gbc
            rom/working/quintra.map
            rom/working/quintra.noi

  manual:
    name: Instruction manual
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Python libraries
        run: python3 -m pip install --user --break-system-packages pillow pypdf

      - name: Build the booklet and preview
        run: make manual

      - name: Upload manual
        uses: actions/upload-artifact@v4
        with:
          name: quintra-manual
          if-no-files-found: error
          path: |
            docs/manual/build/pdf/quintra-manual.pdf
            docs/manual/build/pdf/quintra-manual-booklet.pdf
            docs/manual/build/contact/spreads-contact.png
            docs/manual/build/site/
