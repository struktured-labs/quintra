name: Setup GBDK and mGBA
description: >
  Install cached GBDK-2020 4.5.0 and the pinned mGBA development build,
  and export GBDK for make.

runs:
  using: composite
  steps:
    - name: Cache GBDK 4.5.0
      id: gbdk-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/gbdk
        key: gbdk-2020-4.5.0-linux64-v1

    - name: Install GBDK 4.5.0
      if: steps.gbdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/gbdk-linux64.tar.gz" \
          https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
        mkdir -p "$RUNNER_TOOL_CACHE"
        tar -xzf "$RUNNER_TEMP/gbdk-linux64.tar.gz" -C "$RUNNER_TOOL_CACHE"
        test -x "$RUNNER_TOOL_CACHE/gbdk/bin/lcc"

    - name: Export GBDK
      shell: bash
      run: |
        set -euo pipefail
        test -x "$RUNNER_TOOL_CACHE/gbdk/bin/lcc"
        echo "GBDK=$RUNNER_TOOL_CACHE/gbdk" >> "$GITHUB_ENV"

    # Stable 0.10.5 packages are built without the --script flag. The smoke
    # harness and the controller bot both pass Lua that way, so CI uses the
    # development build that provides mgba-qt and mgba-headless. The tarball
    # hash is the build verified with scripts/test_smoke.sh (mGBA
    # 0.11-9140-1d201b22a). "latest" moves; a mismatch fails closed.
    - name: Cache mGBA development packages
      id: mgba-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/mgba-dev-1d201b22a
        key: mgba-dev-1d201b22a86d31dfb3bc75145403711f6762015f-v1

    - name: Download mGBA development build
      if: steps.mgba-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/mgba.tar.xz" \
          https://s3.amazonaws.com/mgba/mGBA-build-latest-ubuntu64-noble.tar.xz
        echo "41effb02f1596d34e059bf1ee6c341f47cb123686fb81a208e3db7c1647b1d03  $RUNNER_TEMP/mgba.tar.xz" | sha256sum -c -
        dest="$RUNNER_TOOL_CACHE/mgba-dev-1d201b22a"
        rm -rf "$dest"
        mkdir -p "$dest"
        tar -xJf "$RUNNER_TEMP/mgba.tar.xz" -C "$dest" --strip-components=1
        test -f "$dest/libmgba.deb"
        test -f "$dest/mgba-qt.deb"
        test -f "$dest/mgba-sdl.deb"
        test -f "$dest/mgba-headless.deb"

    - name: Install mGBA, Xvfb, and Pillow
      shell: bash
      run: |
        set -euo pipefail
        dest="$RUNNER_TOOL_CACHE/mgba-dev-1d201b22a"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          "$dest/libmgba.deb" \
          "$dest/mgba-sdl.deb" \
          "$dest/mgba-qt.deb" \
          "$dest/mgba-headless.deb" \
          xvfb \
          python3-pil \
          lua5.4
        sudo ln -sfn /usr/bin/luac5.4 /usr/local/bin/luac
        command -v mgba-qt
        command -v mgba-headless
        command -v luac
        timeout 15 mgba-qt --help >"$RUNNER_TEMP/mgba-qt-help.txt" || true
        grep -q -- '--script' "$RUNNER_TEMP/mgba-qt-help.txt"
        python3 -c "from PIL import Image"
